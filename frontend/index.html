<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0B" />
    <script>
      // Blocking (classic, synchronous) script — must run before first paint to avoid a
      // flash of the wrong theme. Mirrors ThemeProvider's resolution logic exactly
      // (src/app/theme/theme-provider.tsx): same storage key, same fallback order.
      ;(function () {
        try {
          var STORAGE_KEY = 'recall-theme'
          var stored = localStorage.getItem(STORAGE_KEY)
          var preference =
            stored === 'light' || stored === 'dark' || stored === 'system' || stored === 'midnight' ? stored : 'system'
          var resolved =
            preference === 'system'
              ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
              : preference === 'midnight'
                ? 'dark'
                : preference
          document.documentElement.setAttribute('data-theme', resolved)
          if (preference === 'midnight') document.documentElement.setAttribute('data-midnight', 'true')

          // Apply saved appearance attributes (accent, radius, font, reduce motion, …) before first
          // paint so there's no flash. Mirrors settings/apply-preferences.ts; best-effort only.
          try {
            var prefs = JSON.parse(localStorage.getItem('recall-preferences') || '{}')
            var a = prefs.appearance || {}
            var root = document.documentElement
            if (a.accentColor) root.setAttribute('data-accent', a.accentColor)
            if (a.radius) root.setAttribute('data-radius', a.radius)
            if (a.typography && a.typography.font) root.setAttribute('data-font', a.typography.font)
            var anim = a.animations || {}
            if (anim.reduceMotion === true || anim.enabled === false) root.setAttribute('data-reduce-motion', 'true')
            var a11y = prefs.accessibility || {}
            if (a11y.highContrast === true) root.setAttribute('data-high-contrast', 'true')
            if (a11y.alwaysVisibleScrollbars === true) root.setAttribute('data-scrollbars', 'always')
          } catch (e2) {}
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
    <title>Recall — Conversations become knowledge</title>
    <meta
      name="description"
      content="Recall transforms meetings into structured decisions, tasks, insights, and searchable organizational knowledge."
    />
    <!-- Placeholder: real production domain not yet assigned. -->
    <link rel="canonical" href="https://recall.example.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Recall" />
    <meta property="og:title" content="Recall — Conversations become knowledge" />
    <meta
      property="og:description"
      content="Recall transforms meetings into structured decisions, tasks, insights, and searchable organizational knowledge."
    />
    <meta property="og:image" content="https://recall.example.com/og-image.png" />
    <meta property="og:url" content="https://recall.example.com/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Recall — Conversations become knowledge" />
    <meta
      name="twitter:description"
      content="Recall transforms meetings into structured decisions, tasks, insights, and searchable organizational knowledge."
    />
    <meta name="twitter:image" content="https://recall.example.com/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
